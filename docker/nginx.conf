server {
  listen      80;
  server_name _;
  root        /usr/share/nginx/html;
  index       index.html;

  # ---------- compresión ----------
  gzip              on;
  gzip_vary         on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css text/javascript application/javascript
                    application/json image/svg+xml application/manifest+json;

  include /etc/nginx/snippets/security-headers.conf;

  # ---------- assets con hash en el nombre: caché larga ----------
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # ---------- el html nunca se cachea ----------
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # ---------- logo, favicon y demás estáticos de public/ ----------
  location ~* \.(svg|png|jpg|jpeg|webp|ico|woff2?)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  # ---------- todo lo demás cae en index.html ----------
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
